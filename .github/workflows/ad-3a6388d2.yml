name: Board AD official-source capture (3a6388d2)

# Session arena/3a6388d2-olbg4. The interactive sandbox cannot reach league, federation
# or OLBG domains, so this job fetches them on a runner with open egress and commits the
# exact bytes plus a SHA-256 manifest. Nothing is parsed or interpreted here.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/3a6388d2-olbg4
    paths:
      - "scripts/session-3a6388d2/collect.py"
      - ".github/workflows/ad-3a6388d2.yml"

permissions:
  contents: write

concurrency:
  group: board-ad-collect-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official sources (fixtures + calendars)
        run: python3 scripts/session-3a6388d2/collect.py

      - name: Fetch official rankings and standings
        run: python3 scripts/session-3a6388d2/collect_rankings.py

      - name: Fetch corrected URLs with SPA payloads preserved
        run: python3 scripts/session-3a6388d2/collect3.py

      - name: Fetch official standings and results used as rating inputs
        run: python3 scripts/session-3a6388d2/collect4.py

      - name: Fetch OLBG per-sport cards and remaining official event pages
        run: python3 scripts/session-3a6388d2/collect5.py

      - name: Commit the snapshot
        run: |
          set -uo pipefail
          git config user.name "board-ad-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/session-3a6388d2/raw data/session-3a6388d2/manifest.json \
                  data/session-3a6388d2/manifest3.json data/session-3a6388d2/manifest4.json \
                  data/session-3a6388d2/manifest5.json data/session-3a6388d2/manifest_rankings.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Board AD: official-source snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; }
            sleep 3
          done
          for attempt in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

name: Board AF official-source capture (80bc6293)

# Session arena/80bc6293-olbg4. The interactive sandbox can only reach github.com / npmjs /
# pypi, so this job fetches OLBG's taxonomy pages and every official league / tour /
# federation endpoint on a runner with open egress and commits the exact response bytes plus
# a SHA-256 manifest. Nothing is parsed or interpreted on the runner; all parsing, line
# origination and verification happen locally from the committed bytes.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/80bc6293-olbg4
    paths:
      - "scripts/session-80bc6293/fetch.py"
      - "scripts/session-80bc6293/targets.json"
      - "scripts/session-80bc6293/targets_pass2.json"
      - "scripts/session-80bc6293/targets_pass3.json"
      - "data/session-80bc6293/.next_pass"
      - ".github/workflows/af-80bc6293.yml"

permissions:
  contents: write

concurrency:
  group: board-af-capture-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/80bc6293-olbg4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture official + OLBG responses with SHA-256 manifest
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          python3 scripts/session-80bc6293/fetch.py \
            scripts/session-80bc6293/targets.json \
            "data/session-80bc6293/capture/$STAMP"
          if [ -f scripts/session-80bc6293/targets_pass2.json ]; then
            python3 scripts/session-80bc6293/fetch.py \
              scripts/session-80bc6293/targets_pass2.json \
              "data/session-80bc6293/capture/$STAMP/pass2" || true
          fi
          if [ -f scripts/session-80bc6293/targets_pass3.json ]; then
            python3 scripts/session-80bc6293/fetch.py \
              scripts/session-80bc6293/targets_pass3.json \
              "data/session-80bc6293/capture/$STAMP/pass3" || true
          fi
      - name: Commit capture to arena/80bc6293-olbg4
        run: |
          git config user.name "board-af-capture[bot]"
          git config user.email "board-af-capture@users.noreply.github.com"
          git add "data/session-80bc6293/capture/$STAMP"
          if git diff --cached --quiet; then
            echo "nothing new to commit"; exit 0
          fi
          git commit -m "Board AF (80bc6293): official-source capture $STAMP [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin arena/80bc6293-olbg4 && git push origin HEAD:arena/80bc6293-olbg4 && break
            sleep 5
          done

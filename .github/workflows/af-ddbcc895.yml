name: Board AF live capture (ddbcc895)

# Board AF (session arena/ddbcc895-olbg4). Fetches live OLBG hub pages and the official
# governing-body / league endpoints listed in scripts/session-ddbcc895/targets.json on a
# runner with open egress, then commits gzip-compressed raw bytes plus a SHA-256 manifest
# to data/session-ddbcc895/capture/<UTC_STAMP>/.
#
# Trigger: a change to data/session-ddbcc895/capture_request (a one-line file holding the
# reason for the capture), or a manual dispatch. The capture commit itself only touches
# data/session-ddbcc895/capture/**, so it can never re-trigger this workflow.

on:
  push:
    branches:
      - arena/ddbcc895-olbg4
    paths:
      - "data/session-ddbcc895/capture_request"
      - ".github/workflows/af-ddbcc895.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: af-ddbcc895-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ddbcc895-olbg4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture OLBG + official feeds with SHA-256 manifest
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          python3 scripts/session-ddbcc895/fetch.py scripts/session-ddbcc895/targets.json "data/session-ddbcc895/capture/$STAMP"
          python3 - <<'PY'
          import json, os
          stamp = os.environ["STAMP"]
          path = f"data/session-ddbcc895/capture/{stamp}/manifest.json"
          m = json.load(open(path))
          print(f"capture {stamp}: {m['http_200_nonempty_count']}/{m['target_count']} HTTP 200")
          for it in m["items"]:
              if it.get("status") != 200:
                  print(f"  {it.get('status')} {it['id']} {it['url']} {it.get('error','')[:60]}")
          PY
      - name: Commit capture to arena/ddbcc895-olbg4
        run: |
          set -euo pipefail
          git config user.name "board-af-capture[bot]"
          git config user.email "board-af-capture@users.noreply.github.com"
          git add "data/session-ddbcc895/capture/$STAMP"
          git commit -m "Board AF (ddbcc895): live capture $STAMP [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin arena/ddbcc895-olbg4 && git push origin HEAD:arena/ddbcc895-olbg4 && break
            sleep 5
          done

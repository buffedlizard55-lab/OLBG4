name: Board AJ official capture (2722b692)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/2722b692-olbg4
    paths:
      - "scripts/session-2722b692/targets.json"
      - "scripts/session-2722b692/fetch.py"
      - ".github/workflows/aj-2722b692.yml"

permissions:
  contents: write

concurrency:
  group: aj-2722b692-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/2722b692-olbg4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture OLBG hubs + official feeds with SHA-256 manifest
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          python3 scripts/session-2722b692/fetch.py scripts/session-2722b692/targets.json "data/session-2722b692/capture/$STAMP" 2>&1 | tee /tmp/capture.log
      - name: Commit capture (even partial)
        if: always()
        run: |
          set -uo pipefail
          git config user.name "board-aj-capture[bot]"
          git config user.email "board-aj-capture@users.noreply.github.com"
          mkdir -p data/session-2722b692/logs
          cp /tmp/capture.log "data/session-2722b692/logs/capture-${STAMP:-unknown}.log" || true
          git add data/session-2722b692
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Board AJ (2722b692): official capture ${STAMP} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin arena/2722b692-olbg4 && git push origin HEAD:arena/2722b692-olbg4 && break
            sleep 5
          done

name: Board AR headless render capture (405e9797)

on:
  workflow_dispatch:
  push:
    branches: [ arena/405e9797-olbg4 ]
    paths:
      - "scripts/session-405e9797/render_targets.json"
      - "scripts/session-405e9797/render.py"
      - ".github/workflows/ar-405e9797-render.yml"

permissions:
  contents: write

concurrency:
  group: ar-405e9797-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/405e9797-olbg4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Render official client-side pages
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          python3 scripts/session-405e9797/render.py scripts/session-405e9797/render_targets.json "data/session-405e9797/render/$STAMP" 2>&1 | tee /tmp/render.log
      - name: Commit rendered capture
        if: always()
        run: |
          set -uo pipefail
          git config user.name "board-ar-render[bot]"
          git config user.email "board-ar-render@users.noreply.github.com"
          mkdir -p data/session-405e9797/logs
          cp /tmp/render.log "data/session-405e9797/logs/render-${STAMP:-unknown}.log" || true
          git add data/session-405e9797
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Board AR (405e9797): headless render capture ${{ env.STAMP }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin arena/405e9797-olbg4 && git push origin HEAD:arena/405e9797-olbg4 && break
            sleep 5
          done

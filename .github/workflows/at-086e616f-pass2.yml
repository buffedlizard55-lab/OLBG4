name: Board AT official capture pass 2 (086e616f)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/086e616f-olbg4
    paths:
      - "scripts/session-086e616f/targets_pass2.json"
      - ".github/workflows/at-086e616f-pass2.yml"

permissions:
  contents: write

concurrency:
  group: at-086e616f-capture-pass2
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/086e616f-olbg4
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pass-2 capture of the gap-closing official endpoints
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          python3 scripts/session-086e616f/fetch.py \
            scripts/session-086e616f/targets_pass2.json \
            "data/session-086e616f/capture/$STAMP" --workers 8 2>&1 | tee /tmp/capture2.log

      - name: Commit pass-2 capture to arena/086e616f-olbg4
        if: always()
        run: |
          set -uo pipefail
          git config user.name "board-at-capture[bot]"
          git config user.email "board-at-capture@users.noreply.github.com"
          mkdir -p data/session-086e616f/logs
          cp /tmp/capture2.log "data/session-086e616f/logs/capture-pass2-${STAMP:-unknown}.log" || true
          git add data/session-086e616f
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Board AT (086e616f): pass-2 official-source capture ${STAMP:-unknown} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin arena/086e616f-olbg4 \
              && git push origin HEAD:arena/086e616f-olbg4 && break
            sleep 5
          done

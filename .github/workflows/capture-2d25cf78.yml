name: Board AF official capture (2d25cf78)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/2d25cf78-olbg4
    paths:
      - "scripts/session-2d25cf78/targets.json"
      - "scripts/session-2d25cf78/fetch.py"
      - ".github/workflows/capture-2d25cf78.yml"

permissions:
  contents: write

concurrency:
  group: af-2d25cf78-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/2d25cf78-olbg4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture official feeds with SHA-256 manifest
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          python3 scripts/session-2d25cf78/fetch.py scripts/session-2d25cf78/targets.json "data/session-2d25cf78/capture/$STAMP" 2>&1 | tee /tmp/capture.log
      - name: Commit capture (even partial) to arena/2d25cf78-olbg4
        if: always()
        run: |
          set -uo pipefail
          git config user.name "board-af-capture[bot]"
          git config user.email "board-af-capture@users.noreply.github.com"
          git add data/session-2d25cf78/capture
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Board AF (2d25cf78): official capture ${{ env.STAMP }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin arena/2d25cf78-olbg4 && git push origin HEAD:arena/2d25cf78-olbg4 && break
            sleep 5
          done

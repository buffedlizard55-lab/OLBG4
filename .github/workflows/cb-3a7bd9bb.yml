name: Board CB capture (session 3a7bd9bb)

# Board CB (arena/3a7bd9bb-olbg4) runs on a runner with open egress: it reads OLBG's 15 in-scope
# sport boards and the official governing-body / league / tour pages for the 26 Oct - 8 Nov 2026
# window, and commits the raw bytes as deterministic gzip plus a sha256 manifest. All parsing,
# line origination and verification then happens locally from those committed bytes.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/3a7bd9bb-olbg4
    paths:
      - "scripts/session-3a7bd9bb/fetch.py"
      - "scripts/session-3a7bd9bb/make_targets.py"
      - "scripts/session-3a7bd9bb/targets.json"
      - ".github/workflows/cb-3a7bd9bb.yml"

permissions:
  contents: write

concurrency:
  group: board-cb-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/3a7bd9bb-olbg4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the target list
        run: python3 scripts/session-3a7bd9bb/make_targets.py
      - name: Fetch every target
        run: python3 scripts/session-3a7bd9bb/fetch.py
      - name: Commit the capture
        run: |
          set -uo pipefail
          git config user.name "board-cb-capture"
          git config user.email "actions@users.noreply.github.com"
          git add data/session-3a7bd9bb scripts/session-3a7bd9bb/targets.json
          if git diff --cached --quiet; then
            echo "capture identical to the committed one"
            exit 0
          fi
          git commit -m "chore(CB): capture OLBG + official sources $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin arena/3a7bd9bb-olbg4 && \
               git push origin HEAD:arena/3a7bd9bb-olbg4; then
              echo pushed
              exit 0
            fi
            sleep 5
          done
          echo "push failed" >&2
          exit 1

name: Collect official fixture sources (Board W)

# Session arena/e5f2dad3-olbg4. The interactive sandbox cannot reach league and
# federation domains, so this job fetches them from a runner with open egress and
# commits the exact bytes plus a SHA-256 manifest. Nothing is parsed here.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/e5f2dad3-olbg4
    paths:
      - "scripts/session-e5f2dad3/collect.py"

permissions:
  contents: write

concurrency:
  group: board-w-collect-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official sources
        run: python3 scripts/session-e5f2dad3/collect.py

      - name: Commit the snapshot
        run: |
          set -uo pipefail
          git config user.name "board-w-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/session-e5f2dad3
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "Board W: official-source snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || git rebase --abort || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

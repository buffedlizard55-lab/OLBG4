name: Board FB official capture (48de8c1d)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/48de8c1d-olbg4
    paths:
      - "scripts/session-48de8c1d/targets.json"
      - "scripts/session-48de8c1d/fetch.py"
      - ".github/workflows/fb-48de8c1d.yml"

permissions:
  contents: write

concurrency:
  group: fb-48de8c1d-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/48de8c1d-olbg4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture live OLBG 15-sport hubs and official governing-body feeds
        run: |
          set -o pipefail
          python3 scripts/session-48de8c1d/fetch.py 2>&1 | tee /tmp/capture.log
      - name: Commit capture bundle to arena/48de8c1d-olbg4
        if: always()
        run: |
          set -uo pipefail
          git config user.name "board-fb-capture[bot]"
          git config user.email "board-fb-capture@users.noreply.github.com"
          mkdir -p data/session-48de8c1d/logs
          STAMP=$(ls -1 data/session-48de8c1d/capture 2>/dev/null | sort | tail -n 1 || echo "run")
          cp /tmp/capture.log "data/session-48de8c1d/logs/capture-${STAMP}.log" || true
          git add data/session-48de8c1d
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Board FB (48de8c1d): official capture ${STAMP} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin arena/48de8c1d-olbg4 && git push origin HEAD:arena/48de8c1d-olbg4 && break
            sleep 5
          done

name: October 26 source-first refresh
on:
  push:
    branches: [arena/69962336-olbg4]
    paths: ['scripts/session-69962336/spec.py', 'scripts/session-69962336/collect.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fresh-69962336
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/session-69962336/collect.py
      - run: python scripts/session-69962336/parse_olbg.py
      - run: python scripts/session-69962336/evidence.py
      - run: python scripts/session-69962336/originate.py
      - name: Save fresh evidence
        if: always()
        run: |
          git config user.name 'OLBG evidence capture'
          git config user.email 'actions@users.noreply.github.com'
          git add data/session-69962336
          if ! git diff --cached --quiet; then
            git commit -m 'capture: October 26 OLBG and official evidence [skip ci]'
            git pull --rebase origin arena/69962336-olbg4
            git push origin arena/69962336-olbg4
          fi
  verify-publication:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/session-69962336/verify.py

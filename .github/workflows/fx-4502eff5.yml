name: Board FX official capture (4502eff5)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/4502eff5-olbg4
    paths:
      - "scripts/session-4502eff5/targets.json"
      - "scripts/session-4502eff5/fetch.py"
      - ".github/workflows/fx-4502eff5.yml"

permissions:
  contents: write

concurrency:
  group: fx-4502eff5-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4502eff5-olbg4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture live OLBG hubs + official governing-body feeds with SHA-256 manifest
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          python3 scripts/session-4502eff5/fetch.py scripts/session-4502eff5/targets.json "data/session-4502eff5/capture/$STAMP" 2>&1 | tee /tmp/capture.log
      - name: Commit capture (even partial) to arena/4502eff5-olbg4
        if: always()
        run: |
          set -uo pipefail
          git config user.name "board-fx-capture[bot]"
          git config user.email "board-fx-capture@users.noreply.github.com"
          mkdir -p data/session-4502eff5/logs
          cp /tmp/capture.log "data/session-4502eff5/logs/capture-${STAMP:-unknown}.log" || true
          git add data/session-4502eff5
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Board FX (4502eff5): official capture ${{ env.STAMP }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin arena/4502eff5-olbg4 && git push origin HEAD:arena/4502eff5-olbg4 && break
            sleep 5
          done

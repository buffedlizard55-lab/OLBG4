name: Ingest, verify, publish

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
      - arena/4afef1af-olbg4
    paths:
      - "pipeline/**"
      - ".github/workflows/olbg.yml"

permissions:
  contents: write

concurrency:
  group: olbg-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline self-test
        run: |
          set -o pipefail
          python -m pipeline.selftest 2>&1 | tee /tmp/pipeline.log

      - name: Ingest, originate, verify, build
        run: |
          set -o pipefail
          python -m pipeline.run --strict 2>&1 | tee -a /tmp/pipeline.log

      - name: Publish failure log
        if: failure()
        run: |
          mkdir -p .ci
          cp /tmp/pipeline.log .ci/last-run.log 2>/dev/null || true
          tail -n 200 /tmp/pipeline.log 2>/dev/null || true
          git config user.name "olbg-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -f .ci/last-run.log 2>/dev/null || true
          git commit -m "ci: capture failure log [skip ci]" 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "olbg-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add session-4afef1af
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(snapshot): refresh official-data snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            data/
            assets/data.json
          retention-days: 14

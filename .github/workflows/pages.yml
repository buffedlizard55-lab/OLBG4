name: Deploy OLBG4 to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify site data is valid JSON (all three builds)
        run: |
          echo "=== Build C (gov-body verified) ==="
          python3 -m json.tool data/matches.json > /dev/null && echo "✓ data/matches.json"
          python3 -m json.tool data/sources.json > /dev/null && echo "✓ data/sources.json"
          if [ -f data/rows.json ]; then python3 -m json.tool data/rows.json > /dev/null && echo "✓ Build A data/rows.json"; fi
          if [ -f data/board.json ]; then python3 -m json.tool data/board.json > /dev/null && echo "✓ Build B data/board.json"; fi
          if [ -f data/match_inventory.json ]; then python3 -m json.tool data/match_inventory.json > /dev/null && echo "✓ B inventory"; fi
          if [ -f data/verification.json ]; then python3 -m json.tool data/verification.json > /dev/null && echo "✓ B verification"; fi
          echo "Checking key HTML files exist..."
          ls -la index.html methodology.html sources.html flagged.html
          ls -la tennis.html basketball.html baseball.html cricket.html rugby.html ice-hockey.html snooker.html darts.html golf.html badminton.html table-tennis.html volleyball.html handball.html esports.html aussie-rules.html
          if [ -f docs/index.html ]; then echo "✓ docs/index.html (Build A)"; ls docs/sports/*.html | head; fi
          if [ -f session-7114b6a1/index.html ]; then echo "✓ session-7114b6a1/index.html (Build B)"; fi
          echo "=== Board R (47b1b4e2) remediation report ==="
          ls -la session-47b1b4e2/index.html session-47b1b4e2/draft-text.html session-47b1b4e2/restored.html session-47b1b4e2/verification.html session-47b1b4e2/merge.html
      - name: Rebuild the master board and dashboard from the six builds
        run: |
          python3 tools/build_master.py
          BOARD_OUT=board BOARD_EXT="../" python3 tools/build_master_site.py

      - name: Verify the master board (sources, predictions, links, scope)
        run: BOARD_DIR=board python3 tools/verify_master.py

      - name: Fail if the committed dashboard is stale
        run: |
          if ! git diff --quiet -- board data/master.json data/master_conflicts.json; then
            echo "tools/build_master.py or tools/build_master_site.py produced different output."
            echo "Run both locally and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Verify Board T live desk (22-28 Oct window)
        run: |
          python3 -m session-cdf25c13.build > /dev/null
          python3 -m session-cdf25c13.render > /dev/null
          python3 -m session-cdf25c13.verify
          if ! git diff --quiet -- data/session-cdf25c13 session-cdf25c13; then
            echo "Board T rebuild produced different output - commit the regenerated files."
            git diff --stat
            exit 1
          fi

      - name: Check no TODO placeholders
        run: |
          ! grep -R "TODO" --include="*.html" --include="*.json" . || (echo "TODO found" && exit 1)
          echo "No TODO placeholders"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

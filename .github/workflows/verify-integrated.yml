name: Verify integrated dashboard

# Gate for the consolidated build (session arena/83451f65-olbg4).
# It rebuilds the line desk from data/integrated/inputs.json and fails if:
#   - any published row lacks a governing-body source URL
#   - any high-confidence row lacks a >=30 word unique write-up
#   - any excluded sport appears in the dataset
#   - any internal link is broken or a generated page is stale

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild lines and pages from the committed inputs
        run: |
          python3 scripts/session-83451f65/transcribe_inputs.py
          python3 scripts/session-83451f65/model.py
          python3 scripts/session-83451f65/build_site.py

      # Root ownership note (Board P, 2026-10-21): the repository root, sports/ and the topic pages
      # are now generated by tools/build_master_site.py (312-row master board). This script still
      # rebuilds them in the CI workspace from data/integrated/inputs.json and still verifies that
      # build, but it no longer asserts that the committed root pages match its own output — that
      # would make two generators fight over the same paths. Its own inputs stay under the check.
      - name: Fail if committed output is stale
        run: |
          if ! git diff --quiet -- data/integrated; then
            echo "Generated data is stale. Run the three scripts and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Line-by-line verification
        run: python3 scripts/session-83451f65/verify.py

      - name: Confirmed JSON parses
        run: |
          for f in data/integrated/*.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done

name: Board W capture (c4fda15e)

# Board W (session arena/c4fda15e-olbg4). Fetches the OLBG hub pages and official
# league pages/APIs listed in scripts/session-c4fda15e/targets.json on a runner with
# open egress and commits the exact bytes (gzip) + a SHA-256 manifest to this board's
# own branch under data/session-c4fda15e/capture/<UTC stamp>/. (Artifact downloads
# are not reachable from the interactive sandbox, so the bytes travel through git.)
# Runs only for pushes to this board's branch that change its target list.
on:
  push:
    branches: ["arena/c4fda15e-olbg4"]
    paths:
      - "scripts/session-c4fda15e/targets.json"

permissions:
  contents: write

concurrency:
  group: w-c4fda15e-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture targets
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          python3 scripts/session-c4fda15e/fetch.py scripts/session-c4fda15e/targets.json "data/session-c4fda15e/capture/$STAMP"
      - name: Commit capture to this board's branch
        run: |
          git config user.name "board-w-capture[bot]"
          git config user.email "board-w-capture@users.noreply.github.com"
          git add "data/session-c4fda15e/capture/$STAMP"
          git commit -m "Board W: runner capture $STAMP [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin arena/c4fda15e-olbg4 && git push origin HEAD:arena/c4fda15e-olbg4 && break
            sleep 5
          done
